[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lectura-vc-zeroshot"
version = "1.3.0"
description = "Conversion vocale zero-shot du français par OpenVoice (ONNX), en local, sons marqués par AudioSeal — French zero-shot voice conversion, AI-watermarked output"
readme = "README.md"
requires-python = ">=3.10"
# Code sous AGPL. Aucun modèle ni vecteur dans la roue : ils sont téléchargés depuis
# Hugging Face (lecturaworld/lectura-vc-zeroshot-v0) avec leurs propres licences :
# OpenVoice et AudioSeal sous MIT ; préréglages fr-f1, melange-f et melange-h
# sous CC BY 4.0 (voir NOTICE).
license = "AGPL-3.0-or-later"
license-files = ["LICENCE.txt", "NOTICE"]
authors = [{name = "Maxime Carrière (Lectura)", email = "admin@lectura.world"}]
keywords = [
    "voice-conversion", "openvoice", "zero-shot", "onnx",
    "french", "speech", "audio", "audioseal", "watermark",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Tout tourne en local ; modèles et préréglages téléchargés au premier usage (bibliothèque standard).
dependencies = [
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://www.lectura.world/developpement/modules/"
Repository = "https://github.com/maxcarriere/lectura-modules/tree/main/VC-ZeroShot"
Issues = "https://github.com/maxcarriere/lectura-modules/issues"
"Modèles et préréglages" = "https://huggingface.co/lecturaworld/lectura-vc-zeroshot-v0"

[tool.setuptools.packages.find]
where = ["src"]

# Jamais de modèle, de vecteur, de son ni de fichier chiffré dans la roue
[tool.setuptools.exclude-package-data]
lectura_vc_zeroshot = ["modeles/*", "presets/*", "*.enc", "*.onnx", "*.pth", "*.wav", "*.npy"]
