[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lectura-phonemiseur"
version = "4.2.1"
description = "Phonémiseur neural du français — G2P + POS + Morpho + Liaison + Groupes de lecture (BiLSTM multi-tâche)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later AND CC-BY-SA-4.0"
license-files = ["LICENCE.txt", "NOTICE", "MODEL_LICENCE.md", "ATTRIBUTION.md"]
authors = [{name = "Maxime Carrière (Lectura)", email = "admin@lectura.world"}]
keywords = [
    "g2p", "grapheme-to-phoneme", "phonemizer", "french", "nlp",
    "phonetics", "ipa", "pos-tagging", "morphology", "liaison",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
# Tout tourne en local avec ONNX Runtime (poids telecharges au premier usage).
dependencies = ["onnxruntime>=1.16", "numpy>=1.24"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16"]
numpy = ["numpy>=1.24"]
formules = ["lectura-formules>=3.8.0"]   # requis par analyser_phrase_complete()
train = ["torch>=2.0", "onnx>=1.14", "onnxruntime>=1.16"]
all = ["onnxruntime>=1.16", "numpy>=1.24", "lectura-formules>=3.8.0"]

[project.urls]
Homepage = "https://www.lectura.world/developpement/modules/"
Repository = "https://github.com/maxcarriere/lectura-modules/tree/main/Phonemiseur"
Issues = "https://github.com/maxcarriere/lectura-modules/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["entrainement*", "evaluation*", "scripts*"]

[tool.setuptools.package-data]
lectura_phonemiseur = ["data/*.json"]

# Publier le minimum (règle du 14/11/2026) : ni copies de sauvegarde, ni la table
# étendue (8 Mo) que seul scripts/generer_corrections_lexique.py écrit ; le paquet ne la lit pas.
[tool.setuptools.exclude-package-data]
lectura_phonemiseur = ["data/*_backup.json", "data/g2p_corrections_lexique_etendu.json"]
