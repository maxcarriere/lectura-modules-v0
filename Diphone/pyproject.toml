[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lectura-diphone"
version = "2.1.0"
description = "Synthèse vocale du français par diphones WORLD (Lectura), en local — French diphone TTS with the WORLD vocoder"
readme = "README.md"
requires-python = ">=3.10"
# Code sous AGPL ; données prosodiques livrées dans la roue (_group_contour_bank.json),
# tirées du corpus SIWIS : CC BY 4.0 (voir NOTICE). La banque de diphones est hors roue
# (Hugging Face, CC BY 4.0).
license = "AGPL-3.0-or-later AND CC-BY-4.0"
license-files = ["LICENCE.txt", "NOTICE", "LICENCE-DONNEES.txt"]
authors = [{name = "Maxime Carrière (Lectura)", email = "admin@lectura.world"}]
keywords = [
    "tts", "french", "text-to-speech", "speech-synthesis",
    "diphone", "world-vocoder", "concatenation", "prosody",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Tout tourne en local ; la banque est téléchargée au premier usage (bibliothèque standard).
dependencies = ["pyworld>=0.3.4", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
# Texte -> phonèmes, en local (poids téléchargés au premier usage par lectura-phonemiseur)
g2p = ["lectura-g2p>=4.1.5"]
# Changement de timbre par IA : version qui pose le filigrane IA (MARQUE_IA)
vc = ["lectura-vc-zeroshot>=1.3"]
# Ancien nom de l'extra (2.0.x) : les dépendances sont désormais obligatoires
local = []
test = ["pytest>=7"]

[project.scripts]
lectura-diphone = "lectura_diphone._cli:main"

[project.urls]
Homepage = "https://www.lectura.world/developpement/modules/"
Repository = "https://github.com/maxcarriere/lectura-modules/tree/main/Diphone"
Issues = "https://github.com/maxcarriere/lectura-modules/issues"
"Banque de diphones" = "https://huggingface.co/lecturaworld/lectura-diphone-v0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lectura_diphone = ["data/*.json", "_group_contour_bank.json"]

# Jamais de banque, de modèle ni de fichier chiffré dans la roue
[tool.setuptools.exclude-package-data]
lectura_diphone = ["modeles/*", "*.dpk*", "*.pkl", "*.enc", "*.onnx", "*.wav", "*.npy"]
